name: Entregas

# Gera o portal de entregas a partir do Jira e publica no GitHub Pages.
# Nada é commitado no repositório.
on:
  schedule:
    - cron: '0 11 * * *' # todo dia às 08:00 (horário de Brasília)
  push:
    branches: [main]
    paths:
      - 'docs/requisitos/**'
      - 'portal/**'
      - '.github/scripts/entregas.mjs'
      - '.github/workflows/entregas.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [release-publicada]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar portal
        run: node .github/scripts/entregas.mjs
        env:
          OUTPUT_DIR: _site
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
