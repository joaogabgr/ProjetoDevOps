name: Entregas

# Atualiza o ENTREGAS.md com a situação de cada requisito, lida do Jira.
on:
  schedule:
    - cron: '0 11 * * *' # todo dia às 08:00 (horário de Brasília)
  workflow_dispatch:
  repository_dispatch:
    types: [release-publicada]

permissions:
  contents: write

concurrency:
  group: entregas
  cancel-in-progress: true

jobs:
  entregas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar ENTREGAS.md
        run: node .github/scripts/entregas.mjs
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- ENTREGAS.md && git ls-files --error-unmatch ENTREGAS.md >/dev/null 2>&1; then
            echo "ENTREGAS.md sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ENTREGAS.md
          git commit -m "docs: atualiza ENTREGAS.md"
          git push
